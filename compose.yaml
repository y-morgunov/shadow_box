services:
  shadow-cube:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SHADOW_PASSWORD: ${SHADOW_PASSWORD:?Set SHADOW_PASSWORD in .env}
      SHADOW_ORIGIN: ${SHADOW_ORIGIN:-http://localhost:8080}
      SHADOW_TIMEOUT: "900"
    volumes:
      - shadow-data:/data
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  shadow-data:
